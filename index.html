
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080c14">
  <title>Visor 3D</title>

  <style>
    :root {
      --bg: #080c14;
      --panel: rgba(12, 17, 27, .85);
      --text: #f5f7fb;
      --muted: #9ca7b8;
      --accent: #75aaff;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
    }

    #app, #viewer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    .topbar {
      position: absolute;
      z-index: 10;
      top: max(12px, env(safe-area-inset-top));
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      pointer-events: none;
    }

    .brand, .status, .controls, .settings {
      background: var(--panel);
      border: 1px solid rgba(255,255,255,.09);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 8px 30px rgba(0,0,0,.2);
    }

    .brand {
      padding: 9px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 650;
    }

    .status {
      max-width: 55%;
      padding: 8px 10px;
      border-radius: 10px;
      color: var(--muted);
      font-size: 10px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .status.ok { color: #65dda3; }
    .status.error { color: #ff7777; }

    .controls {
      position: absolute;
      z-index: 10;
      left: 50%;
      bottom: max(12px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      display: flex;
      gap: 5px;
      padding: 5px;
      border-radius: 15px;
    }

    button {
      color: var(--text);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .controls button {
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 10px;
      background: transparent;
      font-size: 19px;
    }

    .controls button:active,
    .controls button.active {
      background: rgba(117,170,255,.18);
      color: var(--accent);
    }

    .settings {
      position: absolute;
      z-index: 20;
      right: 12px;
      bottom: calc(70px + env(safe-area-inset-bottom));
      width: min(290px, calc(100vw - 24px));
      max-height: 75vh;
      overflow-y: auto;
      padding: 14px;
      border-radius: 15px;
      opacity: 0;
      visibility: hidden;
      transform: translateY(8px);
      transition: .18s ease;
    }

    .settings.open {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .settings-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      font-size: 13px;
    }

    .settings-header button {
      border: 0;
      border-radius: 8px;
      background: rgba(255,255,255,.08);
      font-size: 20px;
      width: 30px;
      height: 30px;
    }

    .setting {
      display: grid;
      grid-template-columns: 1fr 125px;
      align-items: center;
      gap: 12px;
      margin: 14px 0;
      font-size: 11px;
      color: #cbd3df;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }

    select {
      width: 100%;
      padding: 8px;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 8px;
      background: #171e2b;
      color: white;
    }

    .toggle {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-top: 1px solid rgba(255,255,255,.07);
      font-size: 11px;
      color: #cbd3df;
    }

    .toggle input {
      accent-color: var(--accent);
    }

    #modelInfo {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid rgba(255,255,255,.07);
      color: var(--muted);
      font-size: 10px;
      line-height: 1.7;
    }

    #loading {
      position: absolute;
      z-index: 30;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 12px;
      background: rgba(5,8,14,.45);
      backdrop-filter: blur(4px);
    }

    #loading.hidden { display: none; }

    .spinner {
      width: 30px;
      height: 30px;
      border: 2px solid rgba(255,255,255,.15);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #errorBox {
      display: none;
      position: absolute;
      z-index: 40;
      left: 12px;
      right: 12px;
      bottom: 75px;
      padding: 12px;
      border: 1px solid rgba(255,100,100,.3);
      border-radius: 10px;
      background: rgba(50,10,15,.93);
      color: #ffd0d0;
      font-size: 11px;
      line-height: 1.5;
    }

    #errorBox.show { display: block; }

    @media (min-width: 761px) {
      .controls {
        left: auto;
        right: 16px;
        bottom: 16px;
        transform: none;
      }

      .settings {
        right: 16px;
        bottom: 74px;
      }
    }

    @media (max-width: 480px) {
      .brand { font-size: 11px; }
      .controls button {
        width: 37px;
        height: 37px;
      }
      .settings {
        right: 8px;
        width: calc(100vw - 16px);
      }
    }
  </style>
</head>

<body>
<div id="app">
  <div id="viewer"></div>

  <div class="topbar">
    <div class="brand">Visor 3D</div>
    <div id="status" class="status">Preparando visor…</div>
  </div>

  <div class="controls">
    <button id="resetBtn" title="Reiniciar vista" aria-label="Reiniciar">↺</button>
    <button id="fitBtn" title="Encajar modelo" aria-label="Encajar">⌖</button>
    <button id="rotateBtn" title="Rotación automática" aria-label="Rotación">◌</button>
    <button id="fullscreenBtn" title="Pantalla completa" aria-label="Pantalla completa">⛶</button>
    <button id="settingsBtn" title="Ajustes" aria-label="Ajustes">⚙</button>
  </div>

  <aside id="settings" class="settings">
    <div class="settings-header">
      <strong>Ajustes del visor</strong>
      <button id="closeSettingsBtn" aria-label="Cerrar">×</button>
    </div>

    <div class="setting">
      <label for="exposure">Exposición</label>
      <input id="exposure" type="range" min="0.5" max="2" step="0.01" value="1">
    </div>

    <div class="setting">
      <label for="roughness">Rugosidad</label>
      <input id="roughness" type="range" min="0" max="1" step="0.01" value="0.5">
    </div>

    <div class="setting">
      <label for="metalness">Metal</label>
      <input id="metalness" type="range" min="0" max="1" step="0.01" value="0">
    </div>

    <div class="setting">
      <label for="materialMode">Material</label>
      <select id="materialMode">
        <option value="original">Original</option>
        <option value="normal">Normales</option>
      </select>
    </div>

    <label class="toggle">
      <span>Wireframe</span>
      <input id="wireframe" type="checkbox">
    </label>

    <label class="toggle">
      <span>Sombras</span>
      <input id="shadows" type="checkbox" checked>
    </label>

    <div id="modelInfo">Modelo: edificio.glb</div>
  </aside>

  <div id="loading">
    <div class="spinner"></div>
    <div id="loadingText">Cargando edificio.glb…</div>
  </div>

  <div id="errorBox"></div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>

<script type="module">
  import * as THREE from "three";
  import { OrbitControls } from "three/addons/controls/OrbitControls.js";
  import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

  // ==================================================
  // CONFIGURACIÓN
  // Este visor carga únicamente edificio.glb.
  // Debe estar en la misma carpeta que index.html.
  // ==================================================
  const GLB_FILE = "./edificio.glb";

  const container = document.getElementById("viewer");
  const statusEl = document.getElementById("status");
  const loadingEl = document.getElementById("loading");
  const loadingTextEl = document.getElementById("loadingText");
  const errorBox = document.getElementById("errorBox");
  const modelInfoEl = document.getElementById("modelInfo");
  const settingsPanel = document.getElementById("settings");

  let scene, camera, renderer, controls;
  let model = null;
  let baseMaterials = new Map();
  let materials = [];
  let autoRotate = false;

  init();
  loadModel();

  function init() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x080c14);

    camera = new THREE.PerspectiveCamera(
      45,
      container.clientWidth / container.clientHeight,
      0.001,
      100000
    );

    camera.position.set(3, 2.5, 5);

    renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: "high-performance"
    });

    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    container.appendChild(renderer.domElement);

    controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.rotateSpeed = 0.65;
    controls.zoomSpeed = 0.9;
    controls.panSpeed = 0.8;

    scene.add(new THREE.HemisphereLight(0xffffff, 0x1a2230, 2.2));

    const keyLight = new THREE.DirectionalLight(0xffffff, 3.2);
    keyLight.position.set(5, 10, 7);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(2048, 2048);
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0x9bbcff, 1.25);
    fillLight.position.set(-7, 4, 4);
    scene.add(fillLight);

    const rimLight = new THREE.DirectionalLight(0xd9b8ff, 1.5);
    rimLight.position.set(-4, 5, -8);
    scene.add(rimLight);

    setupUI();
    window.addEventListener("resize", onResize);
    animate();
  }

  async function loadModel() {
    showLoading(true, "Cargando edificio.glb…");
    errorBox.classList.remove("show");
    setStatus("Cargando modelo…");

    try {
      const loader = new GLTFLoader();
      const gltf = await new Promise((resolve, reject) => {
        loader.load(
          GLB_FILE,
          resolve,
          xhr => {
            if (xhr.total) {
              const percent = Math.round(xhr.loaded / xhr.total * 100);
              loadingTextEl.textContent = `Cargando modelo… ${percent}%`;
            }
          },
          reject
        );
      });

      model = gltf.scene;
      prepareModel(model);
      scene.add(model);

      showLoading(false);
      setStatus("Modelo cargado", true);
    } catch (error) {
      console.error("Error cargando edificio.glb:", error);
      showLoading(false);
      setStatus("No se pudo cargar el modelo", false, true);

      errorBox.textContent =
        "No se encontró o no se pudo cargar edificio.glb. " +
        "Comprueba que el archivo esté junto a index.html y que su nombre " +
        "sea exactamente edificio.glb.";
      errorBox.classList.add("show");
    }
  }

  function prepareModel(object) {
    object.traverse(child => {
      if (!child.isMesh) return;

      child.castShadow = true;
      child.receiveShadow = true;

      // Clonar materiales permite modificar los ajustes del visor
      // sin alterar los datos originales del archivo GLB.
      if (Array.isArray(child.material)) {
        child.material = child.material.map(m => m.clone());
      } else if (child.material) {
        child.material = child.material.clone();
      }

      const mats = Array.isArray(child.material)
        ? child.material
        : [child.material];

      mats.forEach(material => {
        baseMaterials.set(material.uuid, material);
        materials.push(material);

        if (material.map) {
          material.map.colorSpace = THREE.SRGBColorSpace;
          material.map.needsUpdate = true;
        }

        if (material.emissiveMap) {
          material.emissiveMap.colorSpace = THREE.SRGBColorSpace;
          material.emissiveMap.needsUpdate = true;
        }
      });
    });

    // Centrar el modelo y normalizar su tamaño.
    const box = new THREE.Box3().setFromObject(object);
    const center = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3());
    const maxDimension = Math.max(size.x, size.y, size.z);

    object.position.sub(center);

    if (maxDimension > 0 && Number.isFinite(maxDimension)) {
      object.scale.multiplyScalar(4 / maxDimension);
    }

    const finalBox = new THREE.Box3().setFromObject(object);
    object.position.y -= finalBox.min.y;

    updateModelInfo();
    fitCamera();
  }

  function fitCamera() {
    if (!model) return;

    const box = new THREE.Box3().setFromObject(model);
    const center = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3());
    const maxSize = Math.max(size.x, size.y, size.z);

    const heightDistance =
      maxSize / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)));

    const widthDistance = heightDistance / camera.aspect;
    const distance = 1.35 * Math.max(heightDistance, widthDistance);
    const direction = new THREE.Vector3(1, 0.7, 1).normalize();

    camera.position.copy(center.clone().add(direction.multiplyScalar(distance)));
    controls.target.copy(center);
    controls.minDistance = Math.max(distance * 0.02, 0.01);
    controls.maxDistance = Math.max(distance * 20, 10);

    camera.near = Math.max(distance / 1000, 0.001);
    camera.far = Math.max(distance * 100, 1000);
    camera.updateProjectionMatrix();
    controls.update();
  }

  function resetView() {
    if (!model) return;
    model.rotation.set(0, 0, 0);
    fitCamera();
  }

  function updateModelInfo() {
    let meshCount = 0;
    let vertexCount = 0;
    let triangleCount = 0;
    const materialIds = new Set();

    model.traverse(child => {
      if (!child.isMesh) return;
      meshCount++;

      const position = child.geometry?.getAttribute("position");
      if (position) vertexCount += position.count;

      if (child.geometry?.index) {
        triangleCount += child.geometry.index.count / 3;
      } else if (position) {
        triangleCount += position.count / 3;
      }

      const mats = Array.isArray(child.material)
        ? child.material
        : [child.material];

      mats.forEach(material => {
        if (material) materialIds.add(material.uuid);
      });
    });

    modelInfoEl.innerHTML =
      "<strong>Archivo:</strong> edificio.glb<br>" +
      `<strong>Mallas:</strong> ${meshCount.toLocaleString("es")}<br>` +
      `<strong>Vértices:</strong> ${Math.round(vertexCount).toLocaleString("es")}<br>` +
      `<strong>Triángulos:</strong> ${Math.round(triangleCount).toLocaleString("es")}<br>` +
      `<strong>Materiales:</strong> ${materialIds.size.toLocaleString("es")}`;
  }

  function setupUI() {
    document.getElementById("resetBtn").addEventListener("click", resetView);
    document.getElementById("fitBtn").addEventListener("click", fitCamera);

    document.getElementById("rotateBtn").addEventListener("click", event => {
      autoRotate = !autoRotate;
      controls.autoRotate = autoRotate;
      controls.autoRotateSpeed = 1.4;
      event.currentTarget.classList.toggle("active", autoRotate);
    });

    document.getElementById("fullscreenBtn").addEventListener("click", async () => {
      try {
        if (!document.fullscreenElement) {
          await document.documentElement.requestFullscreen?.();
        } else {
          await document.exitFullscreen?.();
        }
      } catch (error) {
        console.warn("Pantalla completa no disponible:", error);
      }
    });

    document.getElementById("settingsBtn").addEventListener("click", () => {
      settingsPanel.classList.toggle("open");
    });

    document.getElementById("closeSettingsBtn").addEventListener("click", () => {
      settingsPanel.classList.remove("open");
    });

    document.getElementById("exposure").addEventListener("input", event => {
      renderer.toneMappingExposure = Number(event.target.value);
    });

    document.getElementById("roughness").addEventListener("input", event => {
      const value = Number(event.target.value);
      materials.forEach(material => {
        if ("roughness" in material) material.roughness = value;
      });
    });

    document.getElementById("metalness").addEventListener("input", event => {
      const value = Number(event.target.value);
      materials.forEach(material => {
        if ("metalness" in material) material.metalness = value;
      });
    });

    document.getElementById("wireframe").addEventListener("change", event => {
      materials.forEach(material => {
        if ("wireframe" in material) {
          material.wireframe = event.target.checked;
        }
      });
    });

    document.getElementById("shadows").addEventListener("change", event => {
      renderer.shadowMap.enabled = event.target.checked;

      if (model) {
        model.traverse(child => {
          if (child.isMesh) {
            child.castShadow = event.target.checked;
            child.receiveShadow = event.target.checked;
          }
        });
      }
    });

    document.getElementById("materialMode").addEventListener("change", event => {
      const normalMode = event.target.value === "normal";

      model?.traverse(child => {
        if (!child.isMesh) return;

        if (normalMode) {
          if (!child.userData.baseMaterial) {
            child.userData.baseMaterial = child.material;
          }

          if (Array.isArray(child.material)) {
            child.material = child.material.map(() => new THREE.MeshNormalMaterial());
          } else {
            child.material = new THREE.MeshNormalMaterial();
          }
        } else if (child.userData.baseMaterial) {
          child.material = child.userData.baseMaterial;
        }
      });
    });
  }

  function showLoading(show, message = "Cargando modelo 3D…") {
    loadingTextEl.textContent = message;
    loadingEl.classList.toggle("hidden", !show);
  }

  function setStatus(message, ok = false, error = false) {
    statusEl.textContent = message;
    statusEl.classList.toggle("ok", ok);
    statusEl.classList.toggle("error", error);
  }

  function onResize() {
    const width = container.clientWidth;
    const height = container.clientHeight;

    camera.aspect = width / height;
    camera.updateProjectionMatrix();

    renderer.setSize(width, height);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  }

  function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  }
</script>
</body>
</html>
