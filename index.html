<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b0f17" />
  <title>Visor 3D — GitHub Pages</title>

  <style>
    :root {
      --bg: #070a10;
      --panel: rgba(15, 20, 30, 0.88);
      --panel-2: rgba(20, 27, 40, 0.9);
      --border: rgba(255, 255, 255, 0.09);
      --text: #f5f7fb;
      --muted: #9ca7b8;
      --accent: #6ea8ff;
      --accent-2: #8b5cf6;
      --danger: #ff6b6b;
      --success: #5ee6a8;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 20% 10%, rgba(110,168,255,.12), transparent 35%),
        radial-gradient(circle at 80% 90%, rgba(139,92,246,.10), transparent 35%),
        var(--bg);
    }

    #app {
      width: 100%;
      height: 100%;
      position: relative;
    }

    #viewer {
      position: absolute;
      inset: 0;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    .topbar {
      position: absolute;
      z-index: 20;
      top: 16px;
      left: 16px;
      right: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      pointer-events: none;
    }

    .brand, .status {
      pointer-events: auto;
      background: var(--panel);
      border: 1px solid var(--border);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-radius: 14px;
      box-shadow: 0 12px 40px rgba(0,0,0,.25);
    }

    .brand {
      padding: 11px 15px;
    }

    .brand strong {
      display: block;
      font-size: 14px;
      letter-spacing: .2px;
    }

    .brand span {
      display: block;
      color: var(--muted);
      font-size: 11px;
      margin-top: 2px;
    }

    .status {
      padding: 9px 12px;
      color: var(--muted);
      font-size: 12px;
      max-width: 48vw;
      text-align: right;
    }

    .status.ok { color: var(--success); }
    .status.error { color: var(--danger); }

    .sidepanel {
      position: absolute;
      z-index: 20;
      top: 82px;
      right: 16px;
      width: min(310px, calc(100vw - 32px));
      max-height: calc(100vh - 105px);
      overflow: auto;
      padding: 14px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 18px 60px rgba(0,0,0,.35);
    }

    .section {
      padding: 10px 0 13px;
      border-bottom: 1px solid var(--border);
    }

    .section:last-child { border-bottom: 0; }

    .section-title {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .11em;
      margin-bottom: 9px;
      font-weight: 700;
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 9px;
      margin: 8px 0;
    }

    .row label {
      font-size: 12px;
      color: #d9deea;
    }

    input[type="range"] {
      width: 125px;
      accent-color: var(--accent);
    }

    select, button {
      border: 1px solid var(--border);
      color: var(--text);
      background: rgba(255,255,255,.06);
      border-radius: 9px;
      font: inherit;
    }

    select {
      padding: 7px 8px;
      width: 135px;
      outline: none;
    }

    button {
      padding: 8px 10px;
      cursor: pointer;
      transition: .18s ease;
    }

    button:hover {
      background: rgba(255,255,255,.12);
      border-color: rgba(110,168,255,.4);
      transform: translateY(-1px);
    }

    button:active { transform: translateY(0); }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
    }

    .buttons button.full { grid-column: 1 / -1; }

    .switch {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .switch input {
      width: 17px;
      height: 17px;
      accent-color: var(--accent);
    }

    .model-info {
      color: var(--muted);
      font-size: 11px;
      line-height: 1.55;
    }

    .hint {
      position: absolute;
      z-index: 10;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      color: rgba(255,255,255,.72);
      font-size: 11px;
      background: rgba(0,0,0,.28);
      border: 1px solid rgba(255,255,255,.07);
      border-radius: 999px;
      padding: 7px 12px;
      pointer-events: none;
      white-space: nowrap;
      backdrop-filter: blur(10px);
    }

    #loading {
      position: absolute;
      z-index: 30;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      background: rgba(4,7,12,.42);
      backdrop-filter: blur(4px);
    }

    #loading.hidden { display: none; }

    .spinner {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 3px solid rgba(255,255,255,.14);
      border-top-color: var(--accent);
      animation: spin .8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-text {
      color: #dfe6f2;
      font-size: 13px;
    }

    #errorBox {
      position: absolute;
      z-index: 40;
      left: 16px;
      bottom: 58px;
      width: min(520px, calc(100vw - 32px));
      display: none;
      padding: 12px 14px;
      border: 1px solid rgba(255,107,107,.3);
      border-radius: 12px;
      background: rgba(50,12,18,.88);
      color: #ffd4d4;
      font-size: 12px;
      line-height: 1.5;
      backdrop-filter: blur(14px);
    }

    #errorBox.show { display: block; }

    @media (max-width: 760px) {
      .topbar { top: 10px; left: 10px; right: 10px; }
      .sidepanel {
        top: auto;
        left: 10px;
        right: 10px;
        bottom: 10px;
        width: auto;
        max-height: 42vh;
      }
      .hint { display: none; }
      .status { max-width: 55vw; }
    }

    @media (max-width: 480px) {
      .brand span { display: none; }
      .sidepanel { max-height: 47vh; }
      .row input[type="range"] { width: 105px; }
    }
  </style>
</head>

<body>
<div id="app">
  <div id="viewer"></div>

  <div class="topbar">
    <div class="brand">
      <strong>Visor 3D</strong>
      <span>OBJ + MTL + texturas · GitHub Pages</span>
    </div>
    <div id="status" class="status">Iniciando visor…</div>
  </div>

  <aside class="sidepanel">
    <div class="section">
      <div class="section-title">Modelo</div>
      <div id="modelInfo" class="model-info">
        Esperando el modelo…
      </div>
    </div>

    <div class="section">
      <div class="section-title">Vista</div>

      <div class="row">
        <label for="materialMode">Material</label>
        <select id="materialMode">
          <option value="original">Original</option>
          <option value="matcap">Iluminación suave</option>
          <option value="normal">Normales</option>
        </select>
      </div>

      <div class="row">
        <label for="exposure">Exposición</label>
        <input id="exposure" type="range" min="0.5" max="2" step="0.01" value="1">
      </div>

      <div class="row">
        <label for="roughness">Rugosidad</label>
        <input id="roughness" type="range" min="0" max="1" step="0.01" value="0.5">
      </div>

      <div class="row">
        <label for="metalness">Metal</label>
        <input id="metalness" type="range" min="0" max="1" step="0.01" value="0">
      </div>
    </div>

    <div class="section">
      <div class="section-title">Escena</div>

      <div class="row switch">
        <label for="grid">Cuadrícula</label>
        <input id="grid" type="checkbox" checked>
      </div>

      <div class="row switch">
        <label for="wireframe">Wireframe</label>
        <input id="wireframe" type="checkbox">
      </div>

      <div class="row switch">
        <label for="autoRotate">Rotación automática</label>
        <input id="autoRotate" type="checkbox">
      </div>

      <div class="row switch">
        <label for="shadows">Sombras</label>
        <input id="shadows" type="checkbox" checked>
      </div>
    </div>

    <div class="section">
      <div class="section-title">Acciones</div>
      <div class="buttons">
        <button id="resetBtn">↺ Reiniciar</button>
        <button id="fullscreenBtn">⛶ Pantalla completa</button>
        <button id="fitBtn" class="full">⌖ Encajar modelo</button>
      </div>
    </div>
  </aside>

  <div id="loading">
    <div class="spinner"></div>
    <div id="loadingText" class="loading-text">Cargando modelo 3D…</div>
  </div>

  <div id="errorBox"></div>

  <div class="hint">
    Arrastra para rotar · rueda/pellizco para zoom · botón derecho para desplazar
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>

<script type="module">
  import * as THREE from "three";
  import { OrbitControls } from "three/addons/controls/OrbitControls.js";
  import { OBJLoader } from "three/addons/loaders/OBJLoader.js";
  import { MTLLoader } from "three/addons/loaders/MTLLoader.js";

  // ============================================================
  // CONFIGURACIÓN DEL MODELO
  // ============================================================
  // El repositorio contiene solamente:
  //
  //   index.html
  //   building.obj
  //
  // No se necesita selector de archivos ni carpeta adicional.
  // ============================================================

  // ============================================================
  // ARCHIVO DEL MODELO
  // ============================================================
  // El repositorio contiene únicamente:
  //
  //   index.html
  //   building.obj
  //
  // Por eso el OBJ se carga directamente desde la raíz.
  const OBJ_FILE = "./building.obj";

  // ============================================================
  // ESCENA
  // ============================================================

  const container = document.getElementById("viewer");
  const statusEl = document.getElementById("status");
  const loadingEl = document.getElementById("loading");
  const loadingTextEl = document.getElementById("loadingText");
  const errorBox = document.getElementById("errorBox");
  const modelInfoEl = document.getElementById("modelInfo");

  let scene;
  let camera;
  let renderer;
  let controls;
  let model = null;
  let gridHelper = null;
  let animationFrame = null;

  const originalMaterials = new Map();
  const materialObjects = [];

  const clock = new THREE.Clock();

  init();
  loadModelAutomatically();

  function init() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x080c14);

    camera = new THREE.PerspectiveCamera(
      45,
      container.clientWidth / container.clientHeight,
      0.01,
      100000
    );

    camera.position.set(3, 2.5, 5);

    renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: false,
      powerPreference: "high-performance"
    });

    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1;

    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    container.appendChild(renderer.domElement);

    controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.rotateSpeed = 0.65;
    controls.zoomSpeed = 0.9;
    controls.panSpeed = 0.8;
    controls.minDistance = 0.05;
    controls.maxDistance = 100000;
    controls.target.set(0, 0, 0);

    createLights();
    createGrid();
    setupUI();

    window.addEventListener("resize", onResize);

    animate();
  }

  function createLights() {
    const hemi = new THREE.HemisphereLight(
      0xffffff,
      0x1a2230,
      2.2
    );
    scene.add(hemi);

    const key = new THREE.DirectionalLight(0xffffff, 3.2);
    key.position.set(5, 10, 7);
    key.castShadow = true;

    key.shadow.mapSize.set(2048, 2048);
    key.shadow.camera.near = 0.1;
    key.shadow.camera.far = 1000;
    key.shadow.bias = -0.00005;

    scene.add(key);

    const fill = new THREE.DirectionalLight(0x9bbcff, 1.25);
    fill.position.set(-7, 4, 4);
    scene.add(fill);

    const rim = new THREE.DirectionalLight(0xd9b8ff, 1.5);
    rim.position.set(-4, 5, -8);
    scene.add(rim);
  }

  function createGrid() {
    gridHelper = new THREE.GridHelper(
      20,
      20,
      0x4c5b73,
      0x273143
    );

    gridHelper.material.transparent = true;
    gridHelper.material.opacity = 0.42;
    scene.add(gridHelper);
  }

  // ============================================================
  // CARGA AUTOMÁTICA
  // ============================================================

  async function loadModelAutomatically() {
    showLoading(true, "Cargando archivos del modelo…");
    clearError();


    try {
      setStatus("Cargando geometría OBJ…");

      const objLoader = new OBJLoader();
      const object = await loadOBJ(objLoader, OBJ_FILE);

      prepareModel(object);
      showLoading(false);

      setStatus("Modelo cargado correctamente", true);
    } catch (error) {
      console.error(error);

      showLoading(false);
      setStatus("No se pudo cargar building.obj", false, true);

      showError(
        "No se pudo cargar ./building.obj. " +
        "Comprueba que el archivo esté en la raíz del repositorio " +
        "junto a index.html y que el nombre sea exactamente building.obj."
      );
    }
  }

  function loadOBJ(loader, url) {
    return new Promise((resolve, reject) => {
      loader.load(
        url,
        resolve,
        xhr => {
          if (xhr.total) {
            const percent = Math.round((xhr.loaded / xhr.total) * 100);
            loadingTextEl.textContent =
              `Cargando modelo… ${percent}%`;
          }
        },
        reject
      );
    });
  }

  // ============================================================
  // PREPARAR / CENTRAR / ESCALAR
  // ============================================================

  function prepareModel(object) {
    if (model) {
      scene.remove(model);
      disposeObject(model);
    }

    model = object;

    model.traverse(child => {
      if (!child.isMesh) return;

      child.castShadow = true;
      child.receiveShadow = true;

      const materials = Array.isArray(child.material)
        ? child.material
        : [child.material];

      materials.forEach(material => {
        if (!material) return;

        // Guardamos el material original para poder volver a él.
        originalMaterials.set(material.uuid, material);

        materialObjects.push(material);

        if ("color" in material && material.color) {
          material.color.convertSRGBToLinear?.();
        }

        if (material.map) {
          material.map.colorSpace = THREE.SRGBColorSpace;
          material.map.needsUpdate = true;
        }

        if (material.emissiveMap) {
          material.emissiveMap.colorSpace = THREE.SRGBColorSpace;
          material.emissiveMap.needsUpdate = true;
        }

        if ("roughness" in material) {
          material.roughness = Number(
            document.getElementById("roughness").value
          );
        }

        if ("metalness" in material) {
          material.metalness = Number(
            document.getElementById("metalness").value
          );
        }

        material.needsUpdate = true;
      });
    });

    scene.add(model);

    // Centrar y normalizar tamaño.
    const box = new THREE.Box3().setFromObject(model);
    const center = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3());

    model.position.sub(center);

    const maxDimension = Math.max(size.x, size.y, size.z);

    if (maxDimension > 0 && Number.isFinite(maxDimension)) {
      const targetSize = 4;
      const scale = targetSize / maxDimension;
      model.scale.multiplyScalar(scale);
    }

    // Recalcular bounding box después de la escala.
    const finalBox = new THREE.Box3().setFromObject(model);
    const finalSize = finalBox.getSize(new THREE.Vector3());

    // Colocar el modelo apoyado aproximadamente sobre Y=0.
    model.position.y -= finalBox.min.y;

    // La cuadrícula queda debajo.
    if (gridHelper) {
      gridHelper.position.y = 0;
      gridHelper.scale.setScalar(
        Math.max(finalSize.x, finalSize.z, 4) / 10
      );
    }

    fitCameraToModel();

    updateModelInfo();
  }

  function fitCameraToModel() {
    if (!model) return;

    const box = new THREE.Box3().setFromObject(model);
    const center = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3());

    const maxSize = Math.max(size.x, size.y, size.z);
    const fitHeightDistance =
      maxSize / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov * 0.5)));

    const fitWidthDistance = fitHeightDistance / camera.aspect;

    const distance = 1.35 * Math.max(fitHeightDistance, fitWidthDistance);

    const direction = new THREE.Vector3(1, 0.7, 1).normalize();

    camera.position.copy(
      center.clone().add(direction.multiplyScalar(distance))
    );

    controls.target.copy(center);
    controls.maxDistance = Math.max(distance * 20, 10);
    controls.minDistance = Math.max(distance * 0.02, 0.01);

    camera.near = Math.max(distance / 1000, 0.001);
    camera.far = Math.max(distance * 100, 1000);
    camera.updateProjectionMatrix();

    controls.update();
  }

  function resetView() {
    if (!model) return;

    model.rotation.set(0, 0, 0);
    fitCameraToModel();
  }

  function updateModelInfo() {
    if (!model) return;

    let meshes = 0;
    let vertices = 0;
    let triangles = 0;
    let materials = new Set();

    model.traverse(child => {
      if (!child.isMesh) return;

      meshes++;

      if (child.geometry) {
        const position = child.geometry.getAttribute("position");
        if (position) vertices += position.count;

        if (child.geometry.index) {
          triangles += child.geometry.index.count / 3;
        } else if (position) {
          triangles += position.count / 3;
        }
      }

      const mats = Array.isArray(child.material)
        ? child.material
        : [child.material];

      mats.forEach(m => {
        if (m) materials.add(m.uuid);
      });
    });

    modelInfoEl.innerHTML =
      `<strong>Archivo:</strong> building.obj<br>` +
      `<strong>Mallas:</strong> ${meshes.toLocaleString("es")}<br>` +
      `<strong>Vértices:</strong> ${Math.round(vertices).toLocaleString("es")}<br>` +
      `<strong>Triángulos:</strong> ${Math.round(triangles).toLocaleString("es")}<br>` +
      `<strong>Materiales:</strong> ${materials.size.toLocaleString("es")}`;
  }

  // ============================================================
  // UI
  // ============================================================

  function setupUI() {
    document.getElementById("resetBtn")
      .addEventListener("click", resetView);

    document.getElementById("fitBtn")
      .addEventListener("click", fitCameraToModel);

    document.getElementById("fullscreenBtn")
      .addEventListener("click", toggleFullscreen);

    document.getElementById("grid")
      .addEventListener("change", e => {
        gridHelper.visible = e.target.checked;
      });

    document.getElementById("autoRotate")
      .addEventListener("change", e => {
        controls.autoRotate = e.target.checked;
        controls.autoRotateSpeed = 1.4;
      });

    document.getElementById("shadows")
      .addEventListener("change", e => {
        renderer.shadowMap.enabled = e.target.checked;
        if (model) {
          model.traverse(child => {
            if (child.isMesh) child.castShadow = e.target.checked;
          });
        }
      });

    document.getElementById("wireframe")
      .addEventListener("change", e => {
        if (!model) return;

        model.traverse(child => {
          if (!child.isMesh) return;

          const mats = Array.isArray(child.material)
            ? child.material
            : [child.material];

          mats.forEach(m => {
            if (m) m.wireframe = e.target.checked;
          });
        });
      });

    document.getElementById("exposure")
      .addEventListener("input", e => {
        renderer.toneMappingExposure = Number(e.target.value);
      });

    document.getElementById("roughness")
      .addEventListener("input", e => {
        if (!model) return;

        const value = Number(e.target.value);

        model.traverse(child => {
          if (!child.isMesh) return;

          const mats = Array.isArray(child.material)
            ? child.material
            : [child.material];

          mats.forEach(m => {
            if (m && "roughness" in m) {
              m.roughness = value;
              m.needsUpdate = true;
            }
          });
        });
      });

    document.getElementById("metalness")
      .addEventListener("input", e => {
        if (!model) return;

        const value = Number(e.target.value);

        model.traverse(child => {
          if (!child.isMesh) return;

          const mats = Array.isArray(child.material)
            ? child.material
            : [child.material];

          mats.forEach(m => {
            if (m && "metalness" in m) {
              m.metalness = value;
              m.needsUpdate = true;
            }
          });
        });
      });

    document.getElementById("materialMode")
      .addEventListener("change", e => {
        setMaterialMode(e.target.value);
      });
  }

  function setMaterialMode(mode) {
    if (!model) return;

    model.traverse(child => {
      if (!child.isMesh) return;

      if (mode === "original") {
        const original = child.userData.originalMaterial;

        if (original) {
          child.material = original;
        }

        child.material.needsUpdate = true;
        return;
      }

      if (!child.userData.originalMaterial) {
        child.userData.originalMaterial = child.material;
      }

      if (mode === "normal") {
        const count = Array.isArray(child.material)
          ? child.material.length
          : 1;

        if (count === 1) {
          child.material = new THREE.MeshNormalMaterial({
            flatShading: false
          });
        }

        return;
      }

      if (mode === "matcap") {
        const count = Array.isArray(child.material)
          ? child.material.length
          : 1;

        if (count === 1) {
          child.material = new THREE.MeshStandardMaterial({
            color: 0xd8dee9,
            roughness: 0.55,
            metalness: 0.05
          });
        }
      }
    });
  }

  function toggleFullscreen() {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen?.();
    } else {
      document.exitFullscreen?.();
    }
  }

  // ============================================================
  // ANIMACIÓN
  // ============================================================

  function animate() {
    animationFrame = requestAnimationFrame(animate);

    const delta = clock.getDelta();

    controls.update();

    if (controls.autoRotate && model) {
      // OrbitControls realiza la rotación automáticamente.
      void delta;
    }

    renderer.render(scene, camera);
  }

  function onResize() {
    const width = container.clientWidth;
    const height = container.clientHeight;

    camera.aspect = width / height;
    camera.updateProjectionMatrix();

    renderer.setSize(width, height);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  }

  // ============================================================
  // ESTADO / ERRORES
  // ============================================================

  function showLoading(show, text = "Cargando modelo 3D…") {
    loadingTextEl.textContent = text;
    loadingEl.classList.toggle("hidden", !show);
  }

  function setStatus(text, ok = false, error = false) {
    statusEl.textContent = text;
    statusEl.classList.toggle("ok", ok);
    statusEl.classList.toggle("error", error);
  }

  function showError(message) {
    errorBox.textContent = message;
    errorBox.classList.add("show");
  }

  function clearError() {
    errorBox.textContent = "";
    errorBox.classList.remove("show");
  }

  function escapeHTML(value) {
    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function disposeObject(object) {
    object.traverse(child => {
      if (!child.isMesh) return;

      if (child.geometry) child.geometry.dispose();

      const materials = Array.isArray(child.material)
        ? child.material
        : [child.material];

      materials.forEach(material => {
        if (!material) return;

        for (const key in material) {
          const value = material[key];

          if (value && value.isTexture) {
            value.dispose();
          }
        }

        material.dispose?.();
      });
    });
  }

  // Evita errores si la página se cierra durante una carga.
  window.addEventListener("beforeunload", () => {
    if (animationFrame) cancelAnimationFrame(animationFrame);
  });
</script>
</body>
</html>
