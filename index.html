<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b0f17" />
  <title>Visor 3D — GitHub Pages</title>

  <style>
    :root {
      --bg: #070a10;
      --panel: rgba(15, 20, 30, 0.88);
      --panel-2: rgba(20, 27, 40, 0.9);
      --border: rgba(255, 255, 255, 0.09);
      --text: #f5f7fb;
      --muted: #9ca7b8;
      --accent: #6ea8ff;
      --accent-2: #8b5cf6;
      --danger: #ff6b6b;
      --success: #5ee6a8;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 20% 10%, rgba(110,168,255,.12), transparent 35%),
        radial-gradient(circle at 80% 90%, rgba(139,92,246,.10), transparent 35%),
        var(--bg);
    }

    #app {
      width: 100%;
      height: 100%;
      position: relative;
    }

    #viewer {
      position: absolute;
      inset: 0;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    .topbar {
      position: absolute;
      z-index: 20;
      top: max(12px, env(safe-area-inset-top));
      left: 12px;
      right: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      pointer-events: none;
    }

    .brand,
    .status,
    .mobile-controls,
    .settings-panel {
      background: rgba(10, 14, 22, .72);
      border: 1px solid rgba(255,255,255,.08);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 10px 35px rgba(0,0,0,.22);
    }

    .brand {
      pointer-events: auto;
      padding: 8px 11px;
      border-radius: 12px;
    }

    .brand strong {
      display: block;
      font-size: 12px;
      font-weight: 650;
      letter-spacing: .1px;
    }

    .brand span {
      display: block;
      color: #8995a8;
      font-size: 9px;
      margin-top: 1px;
    }

    .status {
      padding: 7px 9px;
      border-radius: 10px;
      color: #9ba7b8;
      font-size: 10px;
      max-width: 45vw;
      text-align: right;
      pointer-events: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status.ok { color: #65dda3; }
    .status.error { color: #ff7777; }

    .mobile-controls {
      position: absolute;
      z-index: 20;
      left: 50%;
      bottom: max(14px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      display: flex;
      gap: 5px;
      padding: 5px;
      border-radius: 15px;
    }

    .mobile-controls button {
      width: 39px;
      height: 39px;
      padding: 0;
      border: 0;
      border-radius: 11px;
      color: #eef3fb;
      background: transparent;
      font-size: 18px;
      display: grid;
      place-items: center;
      -webkit-tap-highlight-color: transparent;
    }

    .mobile-controls button:active {
      background: rgba(255,255,255,.13);
      transform: scale(.94);
    }

    .mobile-controls button.active {
      color: #7db2ff;
      background: rgba(110,168,255,.13);
    }

    .settings-panel {
      position: absolute;
      z-index: 25;
      right: 12px;
      bottom: calc(70px + env(safe-area-inset-bottom));
      width: min(285px, calc(100vw - 24px));
      padding: 13px;
      border-radius: 15px;
      transform: translateY(10px) scale(.97);
      opacity: 0;
      visibility: hidden;
      transition: .18s ease;
    }

    .settings-panel.open {
      transform: translateY(0) scale(1);
      opacity: 1;
      visibility: visible;
    }

    .settings-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 13px;
      font-size: 13px;
    }

    .settings-head button {
      width: 28px;
      height: 28px;
      padding: 0;
      border: 0;
      border-radius: 8px;
      background: rgba(255,255,255,.06);
      color: #dce4f0;
      font-size: 19px;
    }

    .setting {
      display: grid;
      grid-template-columns: 1fr 125px;
      align-items: center;
      gap: 12px;
      margin: 11px 0;
    }

    .setting label,
    .toggle,
    .section-label {
      color: #cbd3df;
      font-size: 11px;
    }

    .section-label {
      display: block;
      margin: 16px 0 7px;
      color: #7f8b9e;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .color-setting {
      display: grid;
      grid-template-columns: 1fr 42px;
      align-items: center;
      gap: 12px;
      margin: 9px 0;
    }

    .color-setting input[type="color"] {
      width: 42px;
      height: 28px;
      padding: 2px;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 8px;
      background: rgba(255,255,255,.05);
      cursor: pointer;
    }

    .small-action {
      width: 100%;
      margin-top: 7px;
      padding: 8px 10px;
      border: 1px solid rgba(255,255,255,.07);
      border-radius: 9px;
      background: rgba(255,255,255,.045);
      color: #cbd3df;
      font: inherit;
      font-size: 10px;
      cursor: pointer;
    }

    .small-action:active {
      transform: scale(.98);
      background: rgba(255,255,255,.08);
    }

    input[type="range"] {
      width: 100%;
      accent-color: #75aaff;
    }

    select {
      width: 100%;
      padding: 7px 8px;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 8px;
      outline: none;
      color: #e9eef6;
      background: rgba(255,255,255,.06);
      font: inherit;
      font-size: 11px;
    }

    .toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
      border-top: 1px solid rgba(255,255,255,.06);
    }

    .toggle input {
      width: 16px;
      height: 16px;
      accent-color: #75aaff;
    }

    .model-info {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid rgba(255,255,255,.06);
      color: #7f8b9e;
      font-size: 9px;
      line-height: 1.5;
    }

    .hint {
      position: absolute;
      z-index: 10;
      left: 50%;
      bottom: 76px;
      transform: translateX(-50%);
      color: rgba(255,255,255,.42);
      font-size: 9px;
      pointer-events: none;
      white-space: nowrap;
    }

    #loading {
      position: absolute;
      z-index: 30;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 10px;
      background: rgba(4,7,12,.28);
      backdrop-filter: blur(3px);
    }

    #loading.hidden { display: none; }

    .spinner {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,.12);
      border-top-color: #75aaff;
      animation: spin .8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-text {
      color: #cdd6e4;
      font-size: 11px;
    }

    #errorBox {
      position: absolute;
      z-index: 40;
      left: 12px;
      right: 12px;
      bottom: 70px;
      display: none;
      padding: 10px 12px;
      border: 1px solid rgba(255,107,107,.25);
      border-radius: 10px;
      background: rgba(45,10,15,.88);
      color: #ffd0d0;
      font-size: 10px;
      line-height: 1.45;
      backdrop-filter: blur(14px);
    }

    #errorBox.show { display: block; }

    @media (min-width: 761px) {
      .mobile-controls {
        left: auto;
        right: 16px;
        bottom: 16px;
        transform: none;
      }

      .settings-panel {
        right: 16px;
        bottom: 74px;
      }

      .hint {
        bottom: 25px;
      }
    }

    @media (max-width: 480px) {
      html, body {
        background: #080c14;
      }

      .topbar {
        top: max(8px, env(safe-area-inset-top));
        left: 8px;
        right: 8px;
      }

      .brand {
        padding: 7px 9px;
      }

      .brand strong {
        font-size: 11px;
      }

      .brand span {
        display: none;
      }

      .status {
        font-size: 9px;
        padding: 6px 8px;
      }

      .mobile-controls {
        bottom: max(9px, env(safe-area-inset-bottom));
      }

      .mobile-controls button {
        width: 37px;
        height: 37px;
      }

      .settings-panel {
        right: 8px;
        width: calc(100vw - 16px);
        bottom: calc(63px + env(safe-area-inset-bottom));
      }

      .hint {
        display: none;
      }
    }
  </style>
</head>

<body>
<div id="app">
  <div id="viewer"></div>

  <div class="topbar">
    <div class="brand">
      <strong>edificacion.obj</strong>
      <span>Visor 3D</span>
    </div>

    <div id="status" class="status">Cargando…</div>
  </div>

  <div class="mobile-controls">
    <button id="resetBtn" aria-label="Reiniciar vista" title="Reiniciar">↺</button>
    <button id="fitBtn" aria-label="Encajar modelo" title="Encajar">⌖</button>
    <button id="autoRotateBtn" aria-label="Rotación automática" title="Rotación automática">◌</button>
    <button id="fullscreenBtn" aria-label="Pantalla completa" title="Pantalla completa">⛶</button>
    <button id="settingsBtn" aria-label="Ajustes" title="Ajustes">⚙</button>
  </div>

  <aside id="settingsPanel" class="settings-panel" aria-hidden="true">
    <div class="settings-head">
      <strong>Ajustes</strong>
      <button id="closeSettingsBtn" aria-label="Cerrar ajustes">×</button>
    </div>

    <div class="section-label">Edificios</div>

    <div class="color-setting">
      <label for="tower1Color">Torre 1</label>
      <input id="tower1Color" type="color" value="#d8c3a5" aria-label="Color de la torre 1">
    </div>

    <div class="color-setting">
      <label for="tower2Color">Torre 2</label>
      <input id="tower2Color" type="color" value="#aebfd1" aria-label="Color de la torre 2">
    </div>

    <button id="resetColorsBtn" class="small-action" type="button">Restaurar colores originales</button>

    <div class="section-label">Iluminación</div>

    <div class="setting">
      <label for="exposure">Exposición</label>
      <input id="exposure" type="range" min="0.5" max="2" step="0.01" value="1">
    </div>

    <div class="setting">
      <label for="roughness">Rugosidad</label>
      <input id="roughness" type="range" min="0" max="1" step="0.01" value="0.5">
    </div>

    <div class="setting">
      <label for="metalness">Metal</label>
      <input id="metalness" type="range" min="0" max="1" step="0.01" value="0">
    </div>

    <div class="setting">
      <label for="materialMode">Material</label>
      <select id="materialMode">
        <option value="original">Original</option>
        <option value="matcap">Iluminación suave</option>
        <option value="normal">Normales</option>
      </select>
    </div>

    <label class="toggle">
      <span>Wireframe</span>
      <input id="wireframe" type="checkbox">
    </label>

    <label class="toggle">
      <span>Sombras</span>
      <input id="shadows" type="checkbox" checked>
    </label>

    <div id="modelInfo" class="model-info">edificacion.obj</div>
  </aside>

  <div id="loading">
    <div class="spinner"></div>
    <div id="loadingText" class="loading-text">Cargando modelo 3D…</div>
  </div>

  <div id="errorBox"></div>

  <div class="hint">
    Arrastra para rotar · rueda/pellizco para zoom · botón derecho para desplazar
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>

<script type="module">
  import * as THREE from "three";
  import { OrbitControls } from "three/addons/controls/OrbitControls.js";
  import { OBJLoader } from "three/addons/loaders/OBJLoader.js";

  // ============================================================
  // CONFIGURACIÓN DEL MODELO
  // ============================================================
  // El repositorio contiene solamente:
  //
  //   index.html
  //   edificacion.obj
  //
  // No se necesita selector de archivos ni carpeta adicional.
  // ============================================================

  // ============================================================
  // ARCHIVO DEL MODELO
  // ============================================================
  // El repositorio contiene únicamente:
  //
  //   index.html
  //   edificacion.obj
  //
  // Por eso el OBJ se carga directamente desde la raíz.
  const OBJ_FILE = "./edificacion.obj";

  // ============================================================
  // ESCENA
  // ============================================================

  const container = document.getElementById("viewer");
  const statusEl = document.getElementById("status");
  const loadingEl = document.getElementById("loading");
  const loadingTextEl = document.getElementById("loadingText");
  const errorBox = document.getElementById("errorBox");
  const modelInfoEl = document.getElementById("modelInfo");

  let scene;
  let camera;
  let renderer;
  let controls;
  let model = null;
  let animationFrame = null;

  const originalMaterials = new Map();
  const materialObjects = [];

  // Los nombres vienen directamente de edificacion.obj.
  // No se modifica el archivo: solo se aplican colores durante el renderizado.
  const TOWER_PARTS = {
    tower1: new Set([
      "building_3_Cube.016",
      "Cube.011_Cube.015",
      "Cube.010_Cube.014",
      "pegangan.003_Plane.008",
      "tangga.003_Plane.007"
    ]),
    tower2: new Set([
      "building_4_Cube.009"
    ])
  };

  const DEFAULT_TOWER_COLORS = {
    tower1: "#d8c3a5",
    tower2: "#aebfd1"
  };

  const clock = new THREE.Clock();

  init();
  loadModelAutomatically();

  function init() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x080c14);

    camera = new THREE.PerspectiveCamera(
      45,
      container.clientWidth / container.clientHeight,
      0.01,
      100000
    );

    camera.position.set(3, 2.5, 5);

    renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: false,
      powerPreference: "high-performance"
    });

    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1;

    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    container.appendChild(renderer.domElement);

    controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.rotateSpeed = 0.65;
    controls.zoomSpeed = 0.9;
    controls.panSpeed = 0.8;
    controls.minDistance = 0.05;
    controls.maxDistance = 100000;
    controls.target.set(0, 0, 0);

    createLights();
    setupUI();

    window.addEventListener("resize", onResize);

    animate();
  }

  function createLights() {
    const hemi = new THREE.HemisphereLight(
      0xffffff,
      0x1a2230,
      2.2
    );
    scene.add(hemi);

    const key = new THREE.DirectionalLight(0xffffff, 3.2);
    key.position.set(5, 10, 7);
    key.castShadow = true;

    key.shadow.mapSize.set(2048, 2048);
    key.shadow.camera.near = 0.1;
    key.shadow.camera.far = 1000;
    key.shadow.bias = -0.00005;

    scene.add(key);

    const fill = new THREE.DirectionalLight(0x9bbcff, 1.25);
    fill.position.set(-7, 4, 4);
    scene.add(fill);

    const rim = new THREE.DirectionalLight(0xd9b8ff, 1.5);
    rim.position.set(-4, 5, -8);
    scene.add(rim);
  }


  // ============================================================
  // CARGA AUTOMÁTICA
  // ============================================================

  async function loadModelAutomatically() {
    showLoading(true, "Cargando edificacion.obj…");
    clearError();

    try {
      setStatus("Cargando modelo…");

      const objLoader = new OBJLoader();
      const object = await loadOBJ(objLoader, OBJ_FILE);

      prepareModel(object);
      showLoading(false);
      setStatus("Listo", true);
    } catch (error) {
      console.error(error);
      showLoading(false);
      setStatus("Error al cargar", false, true);

      showError(
        "No se pudo cargar edificacion.obj. Comprueba que esté junto a index.html " +
        "en la raíz del repositorio y que el nombre sea exactamente edificacion.obj."
      );
    }
  }

  function loadOBJ(loader, url) {
    return new Promise((resolve, reject) => {
      loader.load(
        url,
        resolve,
        xhr => {
          if (xhr.total) {
            const percent = Math.round((xhr.loaded / xhr.total) * 100);
            loadingTextEl.textContent =
              `Cargando modelo… ${percent}%`;
          }
        },
        reject
      );
    });
  }

  // ============================================================
  // PREPARAR / CENTRAR / ESCALAR
  // ============================================================

  function prepareModel(object) {
    if (model) {
      scene.remove(model);
      disposeObject(model);
    }

    model = object;

    model.traverse(child => {
      if (!child.isMesh) return;

      child.castShadow = true;
      child.receiveShadow = true;

      // Clonamos los materiales para que Torre 1 y Torre 2 puedan tener
      // colores independientes incluso cuando el OBJ reutiliza materiales.
      if (Array.isArray(child.material)) {
        child.material = child.material.map(material => material?.clone?.() ?? material);
      } else if (child.material?.clone) {
        child.material = child.material.clone();
      }

      const materials = Array.isArray(child.material)
        ? child.material
        : [child.material];

      materials.forEach(material => {
        if (!material) return;

        originalMaterials.set(material.uuid, {
          color: material.color?.clone?.() ?? null,
          roughness: "roughness" in material ? material.roughness : null,
          metalness: "metalness" in material ? material.metalness : null,
          wireframe: "wireframe" in material ? material.wireframe : null
        });

        materialObjects.push(material);

        if (material.map) {
          material.map.colorSpace = THREE.SRGBColorSpace;
          material.map.needsUpdate = true;
        }

        if (material.emissiveMap) {
          material.emissiveMap.colorSpace = THREE.SRGBColorSpace;
          material.emissiveMap.needsUpdate = true;
        }

        if ("roughness" in material) {
          material.roughness = Number(document.getElementById("roughness").value);
        }

        if ("metalness" in material) {
          material.metalness = Number(document.getElementById("metalness").value);
        }

        material.needsUpdate = true;
      });
    });

    scene.add(model);

    // Aplicamos color solo en el visor. edificacion.obj permanece intacto.
    applyTowerColors();

    // Centrar y normalizar tamaño.
    const box = new THREE.Box3().setFromObject(model);
    const center = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3());

    model.position.sub(center);

    const maxDimension = Math.max(size.x, size.y, size.z);

    if (maxDimension > 0 && Number.isFinite(maxDimension)) {
      const targetSize = 4;
      const scale = targetSize / maxDimension;
      model.scale.multiplyScalar(scale);
    }

    // Recalcular bounding box después de la escala.
    const finalBox = new THREE.Box3().setFromObject(model);
    const finalSize = finalBox.getSize(new THREE.Vector3());

    // Colocar el modelo apoyado aproximadamente sobre Y=0.
    model.position.y -= finalBox.min.y;


    fitCameraToModel();

    updateModelInfo();
  }

  function getTowerForNode(node) {
    let current = node;

    while (current) {
      if (TOWER_PARTS.tower1.has(current.name)) return "tower1";
      if (TOWER_PARTS.tower2.has(current.name)) return "tower2";
      current = current.parent;
    }

    return null;
  }

  function applyTowerColors() {
    if (!model) return;

    const colors = {
      tower1: document.getElementById("tower1Color")?.value || DEFAULT_TOWER_COLORS.tower1,
      tower2: document.getElementById("tower2Color")?.value || DEFAULT_TOWER_COLORS.tower2
    };

    model.traverse(child => {
      if (!child.isMesh) return;

      const tower = getTowerForNode(child);
      if (!tower) return;

      const materials = Array.isArray(child.material)
        ? child.material
        : [child.material];

      materials.forEach(material => {
        if (!material?.color) return;

        // Multiplicar el color sobre una textura permite conservar detalles
        // si algún día se añade el .mtl/texturas sin cambiar esta lógica.
        material.color.set(colors[tower]);
        material.needsUpdate = true;
      });
    });
  }

  function restoreOriginalMaterials() {
    materialObjects.forEach(material => {
      const original = originalMaterials.get(material.uuid);
      if (!original) return;

      if (original.color && material.color) material.color.copy(original.color);
      if (original.roughness !== null && "roughness" in material) material.roughness = original.roughness;
      if (original.metalness !== null && "metalness" in material) material.metalness = original.metalness;
      if (original.wireframe !== null && "wireframe" in material) material.wireframe = original.wireframe;
      material.needsUpdate = true;
    });

    document.getElementById("tower1Color").value = DEFAULT_TOWER_COLORS.tower1;
    document.getElementById("tower2Color").value = DEFAULT_TOWER_COLORS.tower2;
  }

  function fitCameraToModel() {
    if (!model) return;

    const box = new THREE.Box3().setFromObject(model);
    const center = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3());

    const maxSize = Math.max(size.x, size.y, size.z);
    const fitHeightDistance =
      maxSize / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov * 0.5)));

    const fitWidthDistance = fitHeightDistance / camera.aspect;

    const distance = 1.35 * Math.max(fitHeightDistance, fitWidthDistance);

    const direction = new THREE.Vector3(1, 0.7, 1).normalize();

    camera.position.copy(
      center.clone().add(direction.multiplyScalar(distance))
    );

    controls.target.copy(center);
    controls.maxDistance = Math.max(distance * 20, 10);
    controls.minDistance = Math.max(distance * 0.02, 0.01);

    camera.near = Math.max(distance / 1000, 0.001);
    camera.far = Math.max(distance * 100, 1000);
    camera.updateProjectionMatrix();

    controls.update();
  }

  function resetView() {
    if (!model) return;

    model.rotation.set(0, 0, 0);
    fitCameraToModel();
  }

  function updateModelInfo() {
    if (!model) return;

    let meshes = 0;
    let vertices = 0;
    let triangles = 0;
    let materials = new Set();

    model.traverse(child => {
      if (!child.isMesh) return;

      meshes++;

      if (child.geometry) {
        const position = child.geometry.getAttribute("position");
        if (position) vertices += position.count;

        if (child.geometry.index) {
          triangles += child.geometry.index.count / 3;
        } else if (position) {
          triangles += position.count / 3;
        }
      }

      const mats = Array.isArray(child.material)
        ? child.material
        : [child.material];

      mats.forEach(m => {
        if (m) materials.add(m.uuid);
      });
    });

    modelInfoEl.innerHTML =
      `<strong>Archivo:</strong> edificacion.obj<br>` +
      `<strong>Mallas:</strong> ${meshes.toLocaleString("es")}<br>` +
      `<strong>Vértices:</strong> ${Math.round(vertices).toLocaleString("es")}<br>` +
      `<strong>Triángulos:</strong> ${Math.round(triangles).toLocaleString("es")}<br>` +
      `<strong>Materiales:</strong> ${materials.size.toLocaleString("es")}`;
  }

  // ============================================================
  // UI
  // ============================================================

  function setupUI() {
    document.getElementById("resetBtn")
      .addEventListener("click", resetView);

    document.getElementById("fitBtn")
      .addEventListener("click", fitCameraToModel);

    document.getElementById("fullscreenBtn")
      .addEventListener("click", toggleFullscreen);

    const settingsPanel = document.getElementById("settingsPanel");
    const settingsBtn = document.getElementById("settingsBtn");
    const closeSettingsBtn = document.getElementById("closeSettingsBtn");

    settingsBtn.addEventListener("click", () => {
      const open = settingsPanel.classList.toggle("open");
      settingsPanel.setAttribute("aria-hidden", String(!open));
      settingsBtn.classList.toggle("active", open);
    });

    closeSettingsBtn.addEventListener("click", () => {
      settingsPanel.classList.remove("open");
      settingsPanel.setAttribute("aria-hidden", "true");
      settingsBtn.classList.remove("active");
    });

    const autoRotateBtn = document.getElementById("autoRotateBtn");

    autoRotateBtn.addEventListener("click", () => {
      controls.autoRotate = !controls.autoRotate;
      controls.autoRotateSpeed = 1.4;
      autoRotateBtn.classList.toggle("active", controls.autoRotate);
    });

    // Colores independientes para las dos torres.
    ["tower1Color", "tower2Color"].forEach(id => {
      document.getElementById(id).addEventListener("input", applyTowerColors);
    });

    document.getElementById("resetColorsBtn")
      .addEventListener("click", restoreOriginalMaterials);

    // Ajustes visuales.
    document.getElementById("exposure").addEventListener("input", event => {
      renderer.toneMappingExposure = Number(event.target.value);
    });

    document.getElementById("roughness").addEventListener("input", event => {
      const value = Number(event.target.value);
      materialObjects.forEach(material => {
        if ("roughness" in material) material.roughness = value;
      });
    });

    document.getElementById("metalness").addEventListener("input", event => {
      const value = Number(event.target.value);
      materialObjects.forEach(material => {
        if ("metalness" in material) material.metalness = value;
      });
    });

    document.getElementById("wireframe").addEventListener("change", event => {
      materialObjects.forEach(material => {
        if ("wireframe" in material) material.wireframe = event.target.checked;
      });
    });

    document.getElementById("shadows").addEventListener("change", event => {
      renderer.shadowMap.enabled = event.target.checked;
      if (model) {
        model.traverse(child => {
          if (child.isMesh) {
            child.castShadow = event.target.checked;
            child.receiveShadow = event.target.checked;
          }
        });
      }
    });

    document.getElementById("materialMode").addEventListener("change", event => {
      applyMaterialMode(event.target.value);
    });

  }

  function applyMaterialMode(mode) {
    if (!model) return;

    model.traverse(child => {
      if (!child.isMesh) return;

      const materials = Array.isArray(child.material)
        ? child.material
        : [child.material];

      materials.forEach(material => {
        if (!material) return;

        if (mode === "normal") {
          if (!material.userData.__normalMaterial) {
            material.userData.__normalMaterial = new THREE.MeshNormalMaterial({
              flatShading: false
            });
          }
          // No reemplazamos permanentemente el material; guardamos el actual.
          if (!material.userData.__baseMaterial) {
            material.userData.__baseMaterial = material;
          }
        }
      });
    });

    // Para no romper referencias ni colores, usamos un modo visual sencillo:
    // Normales = MeshNormalMaterial; los otros modos restauran los materiales base.
    if (mode === "normal") {
      model.traverse(child => {
        if (!child.isMesh) return;
        if (!child.userData.__baseMaterial) child.userData.__baseMaterial = child.material;
        if (Array.isArray(child.material)) {
          child.material = child.material.map(() => new THREE.MeshNormalMaterial());
        } else {
          child.material = new THREE.MeshNormalMaterial();
        }
      });
    } else {
      model.traverse(child => {
        if (!child.isMesh || !child.userData.__baseMaterial) return;
        child.material = child.userData.__baseMaterial;
      });
      applyTowerColors();
    }
  }

  function toggleFullscreen() {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen?.();
    } else {
      document.exitFullscreen?.();
    }
  }

  // ============================================================
  // ANIMACIÓN
  // ============================================================

  function animate() {
    animationFrame = requestAnimationFrame(animate);

    const delta = clock.getDelta();

    controls.update();

    if (controls.autoRotate && model) {
      // OrbitControls realiza la rotación automáticamente.
      void delta;
    }

    renderer.render(scene, camera);
  }

  function onResize() {
    const width = container.clientWidth;
    const height = container.clientHeight;

    camera.aspect = width / height;
    camera.updateProjectionMatrix();

    renderer.setSize(width, height);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  }

  // ============================================================
  // ESTADO / ERRORES
  // ============================================================

  function showLoading(show, text = "Cargando modelo 3D…") {
    loadingTextEl.textContent = text;
    loadingEl.classList.toggle("hidden", !show);
  }

  function setStatus(text, ok = false, error = false) {
    statusEl.textContent = text;
    statusEl.classList.toggle("ok", ok);
    statusEl.classList.toggle("error", error);
  }

  function showError(message) {
    errorBox.textContent = message;
    errorBox.classList.add("show");
  }

  function clearError() {
    errorBox.textContent = "";
    errorBox.classList.remove("show");
  }

  function escapeHTML(value) {
    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function disposeObject(object) {
    object.traverse(child => {
      if (!child.isMesh) return;

      if (child.geometry) child.geometry.dispose();

      const materials = Array.isArray(child.material)
        ? child.material
        : [child.material];

      materials.forEach(material => {
        if (!material) return;

        for (const key in material) {
          const value = material[key];

          if (value && value.isTexture) {
            value.dispose();
          }
        }

        material.dispose?.();
      });
    });
  }

  // Evita errores si la página se cierra durante una carga.
  window.addEventListener("beforeunload", () => {
    if (animationFrame) cancelAnimationFrame(animationFrame);
  });
</script>
</body>
</html>
